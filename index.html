  return num(w.study,0) + num(w.revision,0) + num(w.pyq,0) + num(w.math,0) +
         num(w.phychem,0) + num(w.habits,0) + num(w.workout,0);
}

/* ---------------------------------------------------------------------------
   9. NAV / RENDER
   --------------------------------------------------------------------------- */
var RENDERERS = {
  dashboard: renderDashboard,
  today: renderToday,
  timeline: renderTimeline,
  calendar: renderCalendar,
  plan: renderStudyPlan,
  weekly: renderWeekly,
  monthly: renderMonthly,
  syllabus: renderSyllabus,
  revision: renderRevision,
  pyq: renderPYQ,
  tests: renderTests,
  errors: renderErrors,
  habits: renderHabits,
  fitness: renderFitness,
  nutrition: renderNutrition,
  sleep: renderSleep,
  analytics: renderAnalytics,
  notes: renderNotes,
  backup: renderBackup,
  settings: renderSettings
};

function renderSidebar(){
  var nav = el('sideNav');
  if (!nav) return;
  nav.innerHTML = SECTIONS.map(function(s){
    return '<button class="nav-item' + (currentSection === s.id ? ' active' : '') + '" data-nav="' + s.id + '" type="button">' +
      '<span class="ni">' + s.icon + '</span><span>' + escapeHtml(s.label) + '</span></button>';
  }).join('');

  var bn = el('bottomNav');
  if (bn){
    var items = [
      { id:'dashboard', label:'Home', icon:'▦' },
      { id:'plan', label:'Plan', icon:'≡' },
      { id:'syllabus', label:'Study', icon:'☰' },
      { id:'analytics', label:'Analytics', icon:'◔' },
      { id:'__more', label:'More', icon:'⋯' }
    ];
    bn.innerHTML = items.map(function(s){
      var active = (s.id === '__more') ? false : (currentSection === s.id);
      return '<button class="bn-item' + (active ? ' active' : '') + '" data-act="' + (s.id === '__more' ? 'open-sheet' : 'nav') + '"' +
        (s.id === '__more' ? '' : ' data-nav="' + s.id + '"') + ' type="button">' +
        '<span class="bn-ico">' + s.icon + '</span><span>' + escapeHtml(s.label) + '</span></button>';
    }).join('');
  }

  var sg = el('sheetGrid');
  if (sg){
    sg.innerHTML = SECTIONS.map(function(s){
      return '<button class="btn ghost" data-nav="' + s.id + '" data-act="close-sheet" type="button">' + s.icon + ' ' + escapeHtml(s.label) + '</button>';
    }).join('');
  }
}

function renderCurrentSection(){
  var root = el('viewRoot');
  if (!root) return;
  var fn = RENDERERS[currentSection] || renderDashboard;
  var out = '';
  try {
    out = fn();
  } catch (err){
    console.error('Render error in section "' + currentSection + '":', err);
    out = '<div class="card"><div class="card-title">Render Error</div>' +
      '<div class="note">This section failed to render safely. Other sections remain usable.</div>' +
      '<div class="hint">' + escapeHtml(err && err.message ? err.message : String(err)) + '</div></div>';
  }
  root.innerHTML = out;
  applyDensity();
  updateCountdown();
}

function renderAll(){
  renderSidebar();
  renderCurrentSection();
  updateSidebarCountdown();
}

function refreshAll(){ renderAll(); }

function navigate(section){
  if (!RENDERERS[section]) section = 'dashboard';
  currentSection = section;
  window.scrollTo({ top:0, behavior:'smooth' });
  renderAll();
}

function applyDensity(){
  var compact = state.settings.density === 'compact';
  var cards = document.querySelectorAll('.card');
  for (var i = 0; i < cards.length; i++){
    cards[i].style.padding = compact ? '10px 11px' : '';
  }
}

function updateSidebarCountdown(){
  var t = el('sideCountdown');
  if (!t) return;
  var d = calculateDaysRemaining();
  t.textContent = d > 0 ? ('Planning Countdown: ' + d + ' days') : 'Planning window complete';
}

/* ---------------------------------------------------------------------------
   10. REAL-TIME UPDATE
   --------------------------------------------------------------------------- */
function updateRealTimeUI(){
  var now = new Date();
  var h = now.getHours();
  var ampm = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12; if (h12 === 0) h12 = 12;

  var tEl = el('liveTime');
  if (tEl){
    tEl.textContent = (state.settings.showClock === false ? '' : pad2(h12) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds()) + ' ' + ampm);
  }
  var dEl = el('liveDate');
  if (dEl){
    dEl.textContent = now.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  }

  updateCountdown();
  updateFocusDisplay();

  /* Live-update the NOW card if it exists */
  var nowCard = document.querySelector('.now-card');
  if (nowCard && currentSection === 'dashboard'){
    var fresh = renderNowCard();
    var tmp = document.createElement('div');
    tmp.innerHTML = fresh;
    var newCard = tmp.firstChild;
    if (newCard) nowCard.replaceWith(newCard);
  }

  /* Live-update the timeline current highlight */
  if (currentSection === 'timeline'){
    var items = document.querySelectorAll('.tl-item');
    var n = currentMinutes();
    for (var i = 0; i < items.length; i++){
      /* Cheap: skip full re-render on every second; just refresh every 30s */
    }
  }
}

function updateCountdown(){
  var target = new Date(2027, 1, 1, 0, 0, 0);
  var now = new Date();
  var diff = target - now;

  var dEl = el('cdD'), hEl = el('cdH'), mEl = el('cdM'), sEl = el('cdS');
  if (!dEl) return;

  if (diff <= 0){
    dEl.textContent = '0'; hEl.textContent = '0'; mEl.textContent = '0'; sEl.textContent = '0';
    var sub = document.querySelector('#countdownCard .cd-sub');
    if (sub) sub.textContent = 'Planning window complete — final review and consolidation phase.';
    return;
  }

  var totalSec = Math.floor(diff / 1000);
  var days = Math.floor(totalSec / 86400);
  var hours = Math.floor((totalSec % 86400) / 3600);
  var mins = Math.floor((totalSec % 3600) / 60);
  var secs = totalSec % 60;

  dEl.textContent = days;
  hEl.textContent = pad2(hours);
  mEl.textContent = pad2(mins);
  sEl.textContent = pad2(secs);
}

/* ---------------------------------------------------------------------------
   11. FOCUS TIMER
   --------------------------------------------------------------------------- */
function focusTick(){
  if (!focusTimer.running) return;
  focusTimer.remaining--;
  if (focusTimer.remaining <= 0){
    focusTimer.running = false;
    clearInterval(focusTimer.handle);
    focusTimer.handle = null;
    completeFocusSession();
    focusTimer.remaining = focusTimer.total;
  }
  updateFocusDisplay();
}

function updateFocusDisplay(){
  var m = Math.floor(focusTimer.remaining / 60);
  var s = focusTimer.remaining % 60;
  var d = el('focusDisplay');
  if (d) d.textContent = pad2(m) + ':' + pad2(s);
  var fo = el('foTime');
  if (fo) fo.textContent = pad2(m) + ':' + pad2(s);
}

function startFocus(){
  if (focusTimer.running){
    focusTimer.running = false;
    clearInterval(focusTimer.handle);
    focusTimer.handle = null;
  } else {
    focusTimer.running = true;
    focusTimer.handle = setInterval(focusTick, 1000);
  }
  var btn = document.querySelector('[data-act="focus-start"]');
  if (btn) btn.textContent = focusTimer.running ? 'Pause' : 'Start';
  var fo = el('foToggle');
  if (fo) fo.textContent = focusTimer.running ? 'Pause' : 'Start';
  toast(focusTimer.running ? 'Focus session started.' : 'Focus session paused.');
}

function resetFocus(){
  focusTimer.running = false;
  clearInterval(focusTimer.handle);
  focusTimer.handle = null;
  focusTimer.remaining = focusTimer.total;
  updateFocusDisplay();
  var btn = document.querySelector('[data-act="focus-start"]');
  if (btn) btn.textContent = 'Start';
  var fo = el('foToggle');
  if (fo) fo.textContent = 'Start';
}

function setFocusPreset(min){
  focusTimer.total = min * 60;
  focusTimer.remaining = focusTimer.total;
  focusTimer.label = min + '-minute focus';
  focusTimer.running = false;
  clearInterval(focusTimer.handle);
  focusTimer.handle = null;
  renderCurrentSection();
}

function completeFocusSession(){
  var minutes = Math.round(focusTimer.total / 60);
  state.focusSessions = state.focusSessions || [];
  state.focusSessions.push({ id: uid(), date: todayKey(), minutes: minutes, ts: new Date().toISOString() });
  saveData();
  toast('Focus session complete — ' + minutes + ' minutes logged.');
  renderCurrentSection();
}

function openFocusOverlay(){
  var task = getCurrentTask(todayKey());
  focusTimer.taskLabel = task ? task.label : 'Focus session';
  var elTask = el('foTask');
  if (elTask) elTask.textContent = focusTimer.taskLabel;
  var elSub = el('foSub');
  if (elSub) elSub.textContent = focusTimer.label + ' • ' + Math.round(focusTimer.total / 60) + ' min';
  var ov = el('focusOverlay');
  if (ov) ov.classList.add('open');
  focusOverlayOpen = true;
  updateFocusDisplay();
}
function closeFocusOverlay(){
  var ov = el('focusOverlay');
  if (ov) ov.classList.remove('open');
  focusOverlayOpen = false;
}

/* ---------------------------------------------------------------------------
   12. EVENT HANDLING
   --------------------------------------------------------------------------- */
function handleClick(e){
  var t = e.target.closest('[data-act],[data-nav]');
  if (!t) return;

  var navId = t.getAttribute('data-nav');
  var act = t.getAttribute('data-act');

  if (navId && !act){
    e.preventDefault();
    closeSheet();
    navigate(navId);
    return;
  }

  if (!act) return;

  switch (act){
    case 'nav':
      e.preventDefault();
      closeSheet();
      navigate(navId || 'dashboard');
      break;

    case 'toggle-theme': cycleTheme(); break;
    case 'print': window.print(); break;
    case 'open-sheet': openSheet(); break;
    case 'close-sheet': closeSheet(); if (navId) navigate(navId); break;

    case 'toggle-task': {
      var date = t.getAttribute('data-date');
      var id = t.getAttribute('data-id');
      if (!state.tasks[date]) state.tasks[date] = {};
      if (t.checked) state.tasks[date][id] = true;
      else delete state.tasks[date][id];
      saveData();
      renderCurrentSection();
      break;
    }

    case 'habit': {
      var hd = t.getAttribute('data-date');
      var hn = t.getAttribute('data-name');
      if (!state.habits[hd]) state.habits[hd] = {};
      if (t.checked) state.habits[hd][hn] = true;
      else delete state.habits[hd][hn];
      saveData();
      renderCurrentSection();
      break;
    }

    case 'water-inc': {
      var k1 = todayKey();
      state.water[k1] = num(state.water[k1], 0) + 1;
      saveData();
      renderCurrentSection();
      break;
    }
    case 'water-dec': {
      var k2 = todayKey();
      state.water[k2] = Math.max(0, num(state.water[k2], 0) - 1);
      saveData();
      renderCurrentSection();
      break;
    }

    case 'meal': {
      var mk = t.getAttribute('data-date');
      var mm = t.getAttribute('data-meal');
      if (!state.nutrition[mk]) state.nutrition[mk] = {};
      state.nutrition[mk][mm] = t.checked;
      saveData();
      renderCurrentSection();
      break;
    }

    case 'step': toggleChapterStep(t.getAttribute('data-chapter'), t.getAttribute('data-step')); break;

    case 'weak': {
      var cid = t.getAttribute('data-chapter');
      var ch = state.chapters[cid];
      if (ch){
        ch.weak = !ch.weak;
        if (ch.weak) ch.mastered = false;
        saveData();
        refreshAll();
      }
      break;
    }

    case 'rev-done': {
      var rid = t.getAttribute('data-chapter');
      var rr = t.getAttribute('data-round');
      var rc = state.chapters[rid];
      if (rc){
        if (!rc.steps) rc.steps = {};
        rc.steps[rr] = true;
        saveData();
        toast('Revision round marked complete.');
        refreshAll();
      }
      break;
    }

    case 'cal-prev': {
      var cd = parseKey(calendarCursor);
      cd.setMonth(cd.getMonth() - 1);
      calendarCursor = toKey(new Date(cd.getFullYear(), cd.getMonth(), 1));
      renderCurrentSection();
      break;
    }
    case 'cal-next': {
      var cd2 = parseKey(calendarCursor);
      cd2.setMonth(cd2.getMonth() + 1);
      calendarCursor = toKey(new Date(cd2.getFullYear(), cd2.getMonth(), 1));
      renderCurrentSection();
      break;
    }
    case 'cal-today':
      calendarCursor = todayKey(); calendarSelected = todayKey();
      renderCurrentSection();
      break;
    case 'cal-select':
    case 'cal-jump':
      calendarSelected = t.getAttribute('data-date');
      calendarCursor = calendarSelected;
      renderCurrentSection();
      break;

    case 'goto-day': {
      var gd = t.getAttribute('data-date');
      if (!gd) break;
      calendarSelected = gd;
      calendarCursor = gd;
      navigate('calendar');
      break;
    }

    case 'goto-notes': {
      notesDate = t.getAttribute('data-date');
      navigate('notes');
      break;
    }

    case 'notes-prev': notesDate = addDays(notesDate, -1); renderCurrentSection(); break;
    case 'notes-next': notesDate = addDays(notesDate, 1); renderCurrentSection(); break;

    case 'del-pyq': {
      var pid = t.getAttribute('data-id');
      if (!confirmDestructive('Delete this PYQ entry?')) return;
      state.pyqs = (state.pyqs || []).filter(function(x){ return x.id !== pid; });
      saveData();
      renderCurrentSection();
      break;
    }
    case 'del-test': {
      var tid = t.getAttribute('data-id');
      if (!confirmDestructive('Delete this test record?')) return;
      state.tests = (state.tests || []).filter(function(x){ return x.id !== tid; });
      saveData();
      renderCurrentSection();
      break;
    }
    case 'del-error': {
      var eid = t.getAttribute('data-id');
      if (!confirmDestructive('Delete this error entry?')) return;
      state.errors = (state.errors || []).filter(function(x){ return x.id !== eid; });
      saveData();
      renderCurrentSection();
      break;
    }
    case 'del-custom-task': {
      var ctd = t.getAttribute('data-date');
      var ctid = t.getAttribute('data-id');
      if (!state.customTasks[ctd]) break;
      state.customTasks[ctd] = state.customTasks[ctd].filter(function(x){ return x.id !== ctid; });
      saveData();
      renderCurrentSection();
      break;
    }

    case 'err-toggle': {
      var eid2 = t.getAttribute('data-id');
      var ent = (state.errors || []).filter(function(x){ return x.id === eid2; })[0];
      if (ent){
        ent.resolved = !!t.checked;
        saveData();
        renderCurrentSection();
      }
      break;
    }

    case 'fit-done': {
      var fd = t.getAttribute('data-date');
      var fi = Number(t.getAttribute('data-i'));
      var ff = state.fitness[fd];
      if (ff && ff.exercises && ff.exercises[fi]){
        ff.exercises[fi].done = !!t.checked;
        saveData();
        renderCurrentSection();
      }
      break;
    }

    case 'sleep-auto': {
      var sk = todayKey();
      var sd = state.sleep[sk] || {};
      if (sd.bed && sd.wake){
        var b = sd.bed.split(':').map(Number);
        var w = sd.wake.split(':').map(Number);
        var bedMin = b[0] * 60 + b[1];
        var wakeMin = w[0] * 60 + w[1];
        if (wakeMin <= bedMin) wakeMin += 1440;
        sd.hours = Math.round(((wakeMin - bedMin) / 60) * 100) / 100;
        state.sleep[sk] = sd;
        saveData();
        renderCurrentSection();
      } else {
        toast('Enter bed time and wake time first.');
      }
      break;
    }

    case 'focus-start': startFocus(); break;
    case 'focus-reset': resetFocus(); break;
    case 'focus-preset': setFocusPreset(Number(t.getAttribute('data-min')) || 25); break;
    case 'open-focus': openFocusOverlay(); break;
    case 'close-focus': closeFocusOverlay(); break;

    case 'recall': {
      var rk = todayKey();
      if (!state.habitNotes[rk]) state.habitNotes[rk] = {};
      var rn = t.getAttribute('data-name');
      state.habitNotes[rk][rn] = !!t.checked;
      saveData();
      break;
    }

    case 'export': exportData(); break;
    case 'import': importData(); break;
    case 'quick-backup': quickBackup(); break;
    case 'restore-slot': restoreSlot(); break;
    case 'copy-summary': copySummary(); break;
    case 'share-summary': shareSummary(); break;

    case 'reset-tasks': {
      if (!confirmDestructive('Reset all task checkmarks for today?')) return;
      state.tasks[todayKey()] = {};
      saveData();
      toast('Today\'s task checks reset.');
      renderCurrentSection();
      break;
    }
    case 'reset-habits': {
      if (!confirmDestructive('Reset all habit checkmarks for today?')) return;
      state.habits[todayKey()] = {};
      saveData();
      toast('Today\'s habits reset.');
      renderCurrentSection();
      break;
    }
    case 'reset-all': {
      if (!confirmDestructive('FULL RESET — this permanently erases all locally stored data. Continue?')) return;
      if (!confirmDestructive('Are you absolutely sure? This cannot be undone.')) return;
      try { localStorage.removeItem(STORAGE_KEY); } catch(err){}
      state = createDefaultState();
      saveData(true);
      toast('All data reset.');
      navigate('dashboard');
      break;
    }

    case 'request-notify': requestNotifications(); break;

    case 'open-quick': openModal(); break;
    case 'close-modal': closeModal(); break;
    case 'quick-tab': {
      quickTab = t.getAttribute('data-tab') || 'task';
      renderQuickBody();
      break;
    }

    case 'run-tests': runSelfTests(); break;
    case 'clear-diag': diagnosticsLog = []; updateDiagOutput(); break;

    default: break;
  }
}

function confirmDestructive(msg){
  if (!state.settings.confirmDestructive) return true;
  return window.confirm(msg);
}

function handleChange(e){
  var t = e.target.closest('[data-act],[data-form]');
  if (!t) return;
  var act = t.getAttribute('data-act');

  if (act === 'filter-syllabus' || act === 'filter-pyq' || act === 'filter-error'){
    var key = t.getAttribute('data-key');
    filters[key] = t.value;
    renderCurrentSection();
    return;
  }
  if (act === 'filter-plan'){
    filters.planPhase = t.value;
    renderCurrentSection();
    return;
  }

  if (act === 'setting'){
    var sk = t.getAttribute('data-key');
    var v = t.type === 'number' ? Number(t.value) : t.value;
    state.settings[sk] = v;
    if (sk === 'theme') applyTheme();
    saveData(true);
    toast('Setting saved.');
    renderCurrentSection();
    return;
  }

  if (act === 'setting-bool'){
    var bk = t.getAttribute('data-key');
    state.settings[bk] = !!t.checked;
    saveData(true);
    return;
  }

  if (act === 'weight'){
    var wk = t.getAttribute('data-key');
    state.settings.weights[wk] = Number(t.value);
    saveData(true);
    var wt = el('weightTotal');
    if (wt) wt.textContent = weightTotal();
    return;
  }

  if (act === 'sleep'){
    var sd = t.getAttribute('data-date');
    var sf = t.getAttribute('data-f');

function applyTheme(){
  var pref = (state.settings && state.settings.theme) || 'dark';
  var theme = pref;
  if (pref === 'system'){
    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#eef2fa' : '#0a1224');
}
function cycleTheme(){
  var order = ['dark','light','system'];
  var i = order.indexOf((state.settings && state.settings.theme) || 'dark');
  state.settings.theme = order[(i + 1) % order.length];
  applyTheme();
  saveData(true);
  toast('Theme: ' + state.settings.theme);
  renderCurrentSection();
}

function exportData(){
  try {
    var payload = {
      app: 'BSEB 2027 COMMAND CENTER',
      version: DATA_VERSION,
      exportedAt: new Date().toISOString(),
      data: state
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'bseb-2027-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2500);
    state.settings.lastBackup = new Date().toISOString();
    saveData(true);
    toast('Backup exported.');
    renderCurrentSection();
  } catch (err){
    console.error('Export failed:', err);
    toast('Export failed in this browser.');
  }
}

function quickBackup(){
  try {
    localStorage.setItem(BACKUP_KEY, JSON.stringify({ ts: new Date().toISOString(), data: state }));
    toast('Quick backup saved in browser.');
    renderCurrentSection();
  } catch(e){
    toast('Could not save quick backup.');
  }
}

function restoreSlot(){
  try {
    var raw = localStorage.getItem(BACKUP_KEY);
    if (!raw){ toast('No quick slot backup found.'); return; }
    var parsed = JSON.parse(raw);
    if (!parsed || !parsed.data){ toast('Quick slot is unreadable.'); return; }
    if (!confirmDestructive('Restore the quick slot backup? Current data will be replaced.')) return;
    state = mergeStateWithDefaults(parsed.data);
    saveData(true);
    applyTheme();
    toast('Quick slot restored.');
    navigate('dashboard');
  } catch(e){
    toast('Could not restore quick slot.');
  }
}

function importData(){
  var input = el('importFile');
  if (!input || !input.files || !input.files.length){
    toast('Choose a .json backup file first.');
    return;
  }
  var file = input.files[0];
  if (!/\.json$/i.test(file.name)){
    toast('Please select a .json backup file.');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev){
    try {
      var parsed = JSON.parse(String(ev.target.result));
      var data = parsed && parsed.data ? parsed.data : parsed;
      if (!data || typeof data !== 'object') throw new Error('Invalid backup structure');
      if (!confirmDestructive('Import this backup? Your current data will be replaced.')) return;
      state = mergeStateWithDefaults(data);
      saveData(true);
      applyTheme();
      toast('Backup imported successfully.');
      navigate('dashboard');
    } catch (err){
      console.error('Import failed:', err);
      toast('That file could not be read as a valid backup.');
    }
  };
  reader.onerror = function(){ toast('Could not read the selected file.'); };
  reader.readAsText(file);
}

function copySummary(){
  var text = buildSummaryText();
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast('Summary copied to clipboard.');
    }).catch(function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('Summary copied.');
  } catch (e){
    toast('Copy not supported in this browser.');
  }
}
function shareSummary(){
  var text = buildSummaryText();
  if (navigator.share){
    navigator.share({ title:'BSEB 2027 Command Center', text: text }).catch(function(){});
  } else {
    copySummary();
    toast('Sharing not supported — summary copied instead.');
  }
}

   16. GLOBAL SEARCH
   --------------------------------------------------------------------------- */
function runSearch(q){
  var box = el('searchResults');
  if (!box) return;
  q = String(q || '').trim().toLowerCase();
  if (q.length < 2){
    box.hidden = true;
    box.innerHTML = '';
    return;
  }
  var results = [];

  Object.keys(state.chapters || {}).forEach(function(id){
    var c = state.chapters[id];
    var hay = safeStr(c.name) + ' ' + safeStr(c.subject) + ' ' + safeStr(c.area);
    if (hay.toLowerCase().indexOf(q) !== -1){
      results.push({ title: c.name, sub: c.subject + ' • ' + c.area + ' • ' + chapterStatus(c), nav:'syllabus' });
    }
  });

  Object.keys(state.notes || {}).forEach(function(d){
    var n = state.notes[d] || {};
    var hay = safeStr(n.daily) + ' ' + safeStr(n.doubts) + ' ' + safeStr(n.weak) + ' ' + safeStr(n.tomorrow);
    if (hay.toLowerCase().indexOf(q) !== -1){
      results.push({ title: 'Note — ' + prettyDate(d), sub: hay.slice(0, 90), nav:'notes', date:d });
    }
  });

  (state.pyqs || []).forEach(function(p){
    var hay = safeStr(p.subject) + ' ' + safeStr(p.chapter) + ' ' + safeStr(p.year) + ' ' + safeStr(p.notes);
    if (hay.toLowerCase().indexOf(q) !== -1){
      results.push({ title: 'PYQ — ' + p.subject + ' ' + safeStr(p.chapter), sub: shortDate(p.date) + ' • ' + safeStr(p.status), nav:'pyq' });
    }
  });

  (state.tests || []).forEach(function(t){
    var hay = safeStr(t.type) + ' ' + safeStr(t.subject) + ' ' + safeStr(t.syllabus) + ' ' + safeStr(t.weak);
    if (hay.toLowerCase().indexOf(q) !== -1){
      results.push({ title: 'Test — ' + safeStr(t.type) + ' ' + safeStr(t.subject), sub: shortDate(t.date) + ' • ' + num(t.actual,0) + '/' + num(t.max,100), nav:'tests' });
    }
  });

  (state.errors || []).forEach(function(er){
    var hay = safeStr(er.subject) + ' ' + safeStr(er.chapter) + ' ' + safeStr(er.question) + ' ' + safeStr(er.errorType);
    if (hay.toLowerCase().indexOf(q) !== -1){
      results.push({ title: 'Error — ' + er.subject + ' ' + safeStr(er.chapter), sub: safeStr(er.errorType) + ' • ' + (er.resolved ? 'Resolved' : 'Unresolved'), nav:'errors' });
    }
  });

  Object.keys(schedule).forEach(function(d){
    if (d.indexOf(q) !== -1){
      var p = schedule[d];
      results.push({ title: prettyDate(d), sub: safeStr(p.phaseLabel) + ' • ' + safeStr(p.mainChapter), nav:'calendar', date:d });
    }
  });

  results = results.slice(0, 40);

  if (!results.length){
    box.hidden = false;
    box.innerHTML = '<div class="empty">No matches found.</div>';
    return;
  }

  box.hidden = false;
  box.innerHTML = results.map(function(r){
    return '<div class="sr-item" data-sr-nav="' + escapeHtml(r.nav) + '"' + (r.date ? ' data-sr-date="' + escapeHtml(r.date) + '"' : '') + '>' +
      '<div>' + escapeHtml(r.title) + '</div>' +
      '<div class="sr-sub">' + escapeHtml(r.sub || '') + '</div>' +
    '</div>';
  }).join('');
}

function handleSearchResultClick(e){
  var item = e.target.closest('.sr-item');
  if (!item) return;
  var nav = item.getAttribute('data-sr-nav');
  var date = item.getAttribute('data-sr-date');
  var box = el('searchResults');
  if (box){ box.hidden = true; box.innerHTML = ''; }
  var si = el('globalSearch'); if (si) si.value = '';
  if (nav === 'calendar' && date){ calendarSelected = date; calendarCursor = date; }
  if (nav === 'notes' && date){ notesDate = date; }
  navigate(nav || 'dashboard');
}

/* ---------------------------------------------------------------------------
   18. SELF-TESTS / DIAGNOSTICS
   --------------------------------------------------------------------------- */
function runSelfTests(){
  var out = [];
  var pass = 0, fail = 0;
  function check(name, cond){
    if (cond){ out.push('✓ ' + name); pass++; }
    else { out.push('✗ ' + name); fail++; }
  }
  check('viewRoot element exists', !!el('viewRoot'));
  check('sideNav element exists', !!el('sideNav'));
  check('bottomNav element exists', !!el('bottomNav'));
  check('state object exists', !!state && typeof state === 'object');
  check('settings object exists', !!state.settings);
  check('chapters object exists', !!state.chapters && Object.keys(state.chapters).length > 0);
  check('SUBJECTS has no Biology', SUBJECTS.indexOf('Biology') === -1);
  check('schedule covers planning start', !!schedule[PLANNING_START]);
  check('schedule covers planning end', !!schedule[PLANNING_END]);
  check('Sunday becomes rest day', (function(){
    /* Find a Sunday within October 2026 */
    var d = '2026-10-04';
    return schedule[d] && schedule[d].isRest === true;
  })());
  check('All 7 chapter steps present', CHAPTER_STEPS.length === 7);
  check('Routine slots defined', ROUTINE_SLOTS.length > 5);
  check('getCurrentSlot returns object', !!getCurrentSlot());
  check('calculateDailyScore returns number', typeof calculateDailyScore(todayKey()) === 'number');
  check('No duplicate section ids', (function(){
    var seen = {}; for (var i=0;i<SECTIONS.length;i++){ if (seen[SECTIONS[i].id]) return false; seen[SECTIONS[i].id]=true; } return true;
  })());

  /* Storage roundtrip */
  try {
    var testKey = STORAGE_KEY + '_selftest';
    localStorage.setItem(testKey, 'ok');
    var got = localStorage.getItem(testKey);
    localStorage.removeItem(testKey);
    check('localStorage roundtrip', got === 'ok');
  } catch(e){ check('localStorage roundtrip', false); }

  out.unshift('=== SELF TESTS ===');
  out.push('');
  out.push('Passed: ' + pass + '  Failed: ' + fail);
  out.push('Time: ' + new Date().toLocaleString());
  diagnosticsLog = out;
  updateDiagOutput();
  toast('Self-tests: ' + pass + ' passed, ' + fail + ' failed.');
}
function updateDiagOutput(){
  var d = el('diagOut');
  if (!d) return;
  d.textContent = diagnosticsLog.length ? diagnosticsLog.join('\n') : 'No diagnostics run yet.';
}

  schedule = buildSchedule();

  Object.keys(state.chapters).forEach(function(id){
    recalcRevisionDates(state.chapters[id]);
  });

  state.firstRun = false;
  state.lastOpened = new Date().toISOString();
  saveData(true);

  renderAll();

  /* Real-time engine: one 1-second tick */
  setInterval(updateRealTimeUI, 1000);
  updateRealTimeUI();
  updateSidebarCountdown();

  /* Minute-level: refresh current section if it displays live data */
  setInterval(function(){
    var nowDay = todayKey();
    if (nowDay !== lastDayTick){
      lastDayTick = nowDay;
      calendarCursor = nowDay;
      calendarSelected = nowDay;
      notesDate = nowDay;
      renderCurrentSection();
      updateSidebarCountdown();
    }
    if (currentSection === 'timeline' || currentSection === 'today'){
      renderCurrentSection();
    }
  }, 60000);

  /* System theme listener */
  if (window.matchMedia){
    try {
      window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(){
        if (state.settings.theme === 'system') applyTheme();
      });
    } catch (e){}
  }

  window.addEventListener('beforeunload', function(){ saveData(true); });
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'hidden') saveData(true);
  });

  console.log('BSEB 2027 COMMAND CENTER initialized. Planning window: ' + PLANNING_START + ' → ' + PLANNING_END);
}

/* ---------------------------------------------------------------------------
   20. EVENT WIRING
   --------------------------------------------------------------------------- */
document.addEventListener('DOMContentLoaded', function(){
  initializeApp();

  document.addEventListener('click', function(e){
    /* Search result click takes priority */
    if (e.target.closest('.sr-item')){ handleSearchResultClick(e); return; }
    /* Quick action buttons inside modal */
    var qa = e.target.closest('[data-act^="quick-add-"]');
    if (qa){ handleQuickAction(qa.getAttribute('data-act'), qa); return; }
    handleClick(e);
  });
  document.addEventListener('change', handleChange);
  document.addEventListener('input', handleInput);
  document.addEventListener('submit', handleSubmit);
  document.addEventListener('keydown', handleKeydown);

  var si = el('globalSearch');
  if (si){
    var searchTimer = null;
    si.addEventListener('input', function(){
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function(){ runSearch(si.value); }, 220);
    });
  }

  var menuBtn = el('menuBtn');
  if (menuBtn) menuBtn.addEventListener('click', openSheet);

  var sb = el('sheetBack');
  if (sb) sb.addEventListener('click', closeSheet);
  var mb = el('modalBack');
  if (mb) mb.addEventListener('click', closeModal);

  /* Expose a small API for debugging */
  window.BSEB2027 = {
    getState: function(){ return state; },
    save: function(){ saveData(true); },
    export: exportData,
    navigate: navigate,
    runSelfTests: runSelfTests,
    version: DATA_VERSION
  };
});
</script>
</body>
