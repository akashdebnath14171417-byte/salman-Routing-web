<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BSEB 2027 COMMAND CENTER</title>
<meta name="description" content="Ultimate Study • Revision • PYQ • Mock • Habit • Fitness Dashboard — Planning Window 1 Oct 2026 → 1 Feb 2027">
<meta name="theme-color" content="#0a1224">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a1224; --panel:#0e1a30; --panel2:#132241;
  --card:rgba(19,32,58,.75); --card-solid:#132241;
  --border:rgba(120,160,255,.14); --border2:rgba(120,160,255,.30);
  --text:#e8eefc; --muted:#8fa2c7; --faint:#5f7099;
  --blue:#3b82f6; --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
  --purple:#a855f7; --teal:#14b8a6; --orange:#f97316; --indigo:#6366f1;
  --shadow:0 10px 30px rgba(0,0,0,.35); --r:16px; --tap:44px;
}
html[data-theme="light"]{
  --bg:#eef2fa; --panel:#ffffff; --panel2:#f6f9ff;
  --card:rgba(255,255,255,.94); --card-solid:#ffffff;
  --border:rgba(20,50,110,.12); --border2:rgba(20,50,110,.26);
  --text:#0d1a33; --muted:#4a5a7a; --faint:#8595b3;
  --shadow:0 8px 24px rgba(20,40,90,.10);
}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.45;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 600px at 12% -10%,rgba(59,130,246,.16),transparent 60%),
    radial-gradient(800px 600px at 100% 0%,rgba(168,85,247,.10),transparent 60%);
}
html[data-theme="light"] body::before{
  background:
    radial-gradient(900px 600px at 12% -10%,rgba(59,130,246,.10),transparent 60%),
    radial-gradient(800px 600px at 100% 0%,rgba(99,102,241,.07),transparent 60%);
}
.app{position:relative;z-index:1;display:grid;grid-template-columns:252px 1fr;min-height:100vh}

/* SIDEBAR */
.sidebar{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,rgba(13,23,44,.96),rgba(10,18,36,.96));
  border-right:1px solid var(--border);
  padding:16px 12px 20px;display:flex;flex-direction:column;gap:14px;
}
html[data-theme="light"] .sidebar{background:linear-gradient(180deg,#ffffff,#f4f8ff)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 10px;border-bottom:1px solid var(--border)}
.brand-mark{
  width:40px;height:40px;border-radius:12px;flex:0 0 40px;
  background:linear-gradient(135deg,var(--blue),#1d4ed8);
  display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;
  box-shadow:0 6px 18px rgba(37,99,235,.35);
}
.brand-title{font-weight:800;font-size:15px;letter-spacing:.3px}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.sidenav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:11px;border:1px solid transparent;
  background:none;color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;text-align:left;min-height:var(--tap);transition:.15s;
}
.nav-item:hover{background:rgba(59,130,246,.10);color:var(--text)}
.nav-item.active{background:rgba(59,130,246,.16);color:var(--text);border-color:var(--border2)}
.nav-item .ni{width:20px;text-align:center;font-size:14px;opacity:.9}
.sidebar-foot{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.mini-count{font-size:11.5px;color:var(--muted);text-align:center;letter-spacing:.3px}
.save-status{font-size:10.5px;color:var(--faint);text-align:center;letter-spacing:.3px}
.save-status.ok{color:var(--green)}
.save-status.warn{color:var(--amber)}
.save-status.err{color:var(--red)}

/* MAIN */
.main{padding:16px 22px 48px;min-width:0}
.topbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 14px;margin-bottom:16px;border-radius:14px;
  background:var(--card);border:1px solid var(--border);
  backdrop-filter:blur(10px);position:sticky;top:8px;z-index:40;
}
.liveclock{display:flex;flex-direction:column;line-height:1.15;min-width:150px}
.lc-time{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.lc-date{font-size:11.5px;color:var(--muted)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search-wrap{position:relative}
#globalSearch{
  width:240px;max-width:44vw;min-height:38px;padding:8px 12px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--border);color:var(--text);font:inherit;font-size:13px;
}
#globalSearch:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.icon-btn{
  width:38px;height:38px;min-height:38px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel2);color:var(--text);font-size:15px;cursor:pointer;display:grid;place-items:center;
}
.icon-btn:hover{border-color:var(--border2)}
.only-mobile{display:none}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 15px;backdrop-filter:blur(10px);box-shadow:var(--shadow);
}
.card.tight{padding:11px 12px}
.card-title{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700;margin-bottom:10px}
.section-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.section-head h2{font-size:19px;font-weight:800;letter-spacing:.2px}
.section-head .sub{font-size:12px;color:var(--muted)}
.spacer{flex:1}

.kpi{
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 12px;
  display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow);
}
.kpi .k-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-value{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-sub{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.accent{border-color:var(--border2);background:linear-gradient(160deg,rgba(59,130,246,.16),var(--card))}
.kpi.good .k-value{color:var(--green)}
.kpi.warn .k-value{color:var(--amber)}
.kpi.bad .k-value{color:var(--red)}

.countdown{
  background:linear-gradient(150deg,rgba(37,99,235,.22),rgba(168,85,247,.12) 60%,var(--card));
  border:1px solid var(--border2);border-radius:18px;padding:18px;
}
.cd-title{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:800}
.cd-sub{font-size:11.5px;color:var(--faint);margin-top:2px}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.cd-cell{background:rgba(10,18,36,.45);border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center;}
html[data-theme="light"] .cd-cell{background:rgba(255,255,255,.7)}
.cd-num{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.cd-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:5px}

/* NOW CARD */
.now-card{
  background:linear-gradient(150deg,rgba(34,197,94,.14),rgba(59,130,246,.10) 55%,var(--card));
  border:1px solid var(--border2);border-radius:18px;padding:16px 18px;
}
.now-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.now-tag{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.now-title{font-size:20px;font-weight:800;letter-spacing:.2px;margin:4px 0 2px}
.now-slot{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.now-bar{margin-top:12px}
.now-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.now-next{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.now-next .nn-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:800}
.now-next .nn-title{font-size:14.5px;font-weight:700;margin-top:3px}

.btn{
  min-height:var(--tap);padding:10px 14px;border-radius:11px;border:1px solid var(--border2);
  background:rgba(59,130,246,.14);color:var(--text);font:inherit;font-size:13.5px;font-weight:700;
  cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn:hover{background:rgba(59,130,246,.24)}
.btn.primary{background:linear-gradient(135deg,var(--blue),#1d4ed8);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn.ghost:hover{background:rgba(59,130,246,.12)}
.btn.danger{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.4);color:#fca5a5}
html[data-theme="light"] .btn.danger{color:#b91c1c}
.btn.good{background:rgba(34,197,94,.16);border-color:rgba(34,197,94,.4);color:#86efac}
html[data-theme="light"] .btn.good{color:#15803d}
.btn.sm{min-height:34px;padding:6px 10px;font-size:12px;border-radius:9px}
.btn.xs{min-height:28px;padding:3px 8px;font-size:11px;border-radius:8px;font-weight:700}
.btn.block{width:100%}
.quick-actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}

.task{
  display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:11px;
  border:1px solid var(--border);background:var(--panel2);margin-bottom:7px;transition:.15s;
}
.task:hover{border-color:var(--border2)}
.task.done{opacity:.62}
.task.done .t-label{text-decoration:line-through}
.task input[type=checkbox]{width:20px;height:20px;flex:0 0 20px;margin-top:1px;accent-color:var(--blue);cursor:pointer;}
.t-label{font-size:13.5px;font-weight:600;word-break:break-word}
.t-meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:10.5px;font-weight:700;letter-spacing:.3px;border:1px solid var(--border);background:var(--panel2);
}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}

.pbar{height:8px;border-radius:999px;background:rgba(120,160,255,.14);overflow:hidden;width:100%}
.pbar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),#60a5fa);transition:width .35s}
.pbar.green > i{background:linear-gradient(90deg,var(--green),#4ade80)}
.pbar.amber > i{background:linear-gradient(90deg,var(--amber),#fbbf24)}
.pbar.red > i{background:linear-gradient(90deg,var(--red),#f87171)}
.pbar-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.pbar-row .pl{font-size:12px;color:var(--muted);min-width:96px}
.pbar-row .pv{font-size:12px;font-weight:700;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{background:var(--panel2);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800;position:sticky;top:0;z-index:2}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(59,130,246,.06)}
td.num{font-variant-numeric:tabular-nums}

input,select,textarea{
  font:inherit;font-size:13px;color:var(--text);background:var(--panel2);
  border:1px solid var(--border);border-radius:10px;padding:9px 11px;min-height:38px;width:100%;
}
textarea{min-height:80px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.16)}
label.fld{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:5px}
.field{margin-bottom:10px;min-width:0}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

.cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-title{font-size:16px;font-weight:800;min-width:170px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:center;font-weight:800;padding:5px 0}
.cal-cell{
  min-height:72px;border-radius:11px;border:1px solid var(--border);background:var(--panel2);
  padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:.13s;position:relative;
}
.cal-cell:hover{border-color:var(--border2);transform:translateY(-1px)}
.cal-cell.out{opacity:.32}
.cal-cell.today{border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,130,246,.25) inset}
.cal-cell.sel{border-color:var(--blue);background:rgba(59,130,246,.13)}
.cal-cell.rest{background:linear-gradient(160deg,rgba(34,197,94,.12),var(--panel2))}
.cal-dnum{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.cal-badges{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.cal-badge{font-size:9px;padding:1px 5px;border-radius:6px;font-weight:800;letter-spacing:.3px;border:1px solid var(--border)}
.cal-bar{height:3px;border-radius:999px;background:rgba(120,160,255,.16);overflow:hidden;margin-top:2px}
.cal-bar > i{display:block;height:100%;background:var(--green)}

.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(16px,1fr));gap:4px}
.heat-cell{aspect-ratio:1;border-radius:5px;background:rgba(120,160,255,.10);border:1px solid var(--border);cursor:pointer}
.heat-cell.l1{background:rgba(34,197,94,.28)}
.heat-cell.l2{background:rgba(34,197,94,.48)}
.heat-cell.l3{background:rgba(34,197,94,.68)}
.heat-cell.l4{background:rgba(34,197,94,.92)}
.heat-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:9px}

.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.4px;border:1px solid var(--border)}
.b-green{background:rgba(34,197,94,.15);color:#4ade80;border-color:rgba(34,197,94,.35)}
html[data-theme="light"] .b-green{color:#15803d}
.b-amber{background:rgba(245,158,11,.15);color:#fbbf24;border-color:rgba(245,158,11,.35)}
html[data-theme="light"] .b-amber{color:#b45309}
.b-red{background:rgba(239,68,68,.15);color:#f87171;border-color:rgba(239,68,68,.35)}
html[data-theme="light"] .b-red{color:#b91c1c}
.b-blue{background:rgba(59,130,246,.15);color:#60a5fa;border-color:rgba(59,130,246,.35)}
html[data-theme="light"] .b-blue{color:#1d4ed8}
.b-purple{background:rgba(168,85,247,.15);color:#c084fc;border-color:rgba(168,85,247,.35)}
html[data-theme="light"] .b-purple{color:#7e22ce}
.b-muted{background:var(--panel2);color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);line-height:1.55;border-left:2px solid var(--border2);padding-left:10px;margin-top:10px}
.hint{font-size:11px;color:var(--faint)}
.empty{padding:22px 12px;text-align:center;color:var(--faint);font-size:13px}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}

.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12.5px;align-items:center}
.tl-item:last-child{border-bottom:none}
.tl-time{min-width:112px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;font-size:11.5px}
.tl-item.past{opacity:.55}
.tl-item.current{border-left:3px solid var(--green);padding-left:8px;background:rgba(34,197,94,.07);border-radius:6px}
.tl-item.upcoming .tl-time{color:var(--text)}

.timer-display{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:1px;line-height:1.1}
.timer-sub{text-align:center;font-size:11.5px;color:var(--muted);margin-top:4px}

.bottomnav{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(10,18,36,.97);border-top:1px solid var(--border);
  backdrop-filter:blur(14px);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  grid-template-columns:repeat(5,1fr);gap:2px;
}
html[data-theme="light"] .bottomnav{background:rgba(255,255,255,.98)}
.bn-item{
  background:none;border:none;color:var(--muted);font:inherit;font-size:9.5px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;
  cursor:pointer;min-height:52px;justify-content:center;letter-spacing:.3px;
}
.bn-item .bn-ico{font-size:17px;line-height:1}
.bn-item.active{color:var(--blue);background:rgba(59,130,246,.12)}

.search-results{
  position:relative;z-index:35;margin-bottom:14px;border:1px solid var(--border);
  border-radius:14px;background:var(--card);backdrop-filter:blur(12px);padding:8px;max-height:60vh;overflow:auto;
}
.sr-item{padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13px;border:1px solid transparent}
.sr-item:hover{background:rgba(59,130,246,.12);border-color:var(--border)}
.sr-item .sr-sub{font-size:11px;color:var(--muted);margin-top:2px}

.toast{
  position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(20px);
  background:var(--card-solid);border:1px solid var(--border2);color:var(--text);
  padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow);max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:120;display:none}
.sheet-back.open{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:130;background:var(--panel);
  border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--border2);
  padding:16px 14px calc(20px + env(safe-area-inset-bottom));max-height:78vh;overflow-y:auto;
  transform:translateY(100%);transition:.25s;
}
.sheet.open{transform:translateY(0)}
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}

/* FOCUS OVERLAY */
.focus-overlay{
  position:fixed;inset:0;z-index:300;background:rgba(6,12,26,.97);
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;
}
html[data-theme="light"] .focus-overlay{background:rgba(240,245,255,.98)}
.focus-overlay.open{display:flex}
.focus-overlay h3{font-size:14px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:800}
.focus-overlay .fo-task{font-size:22px;font-weight:800;margin:12px 0;max-width:640px}

function pad2(n){ return String(n).padStart(2,'0'); }
function toKey(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function parseKey(k){
  var p = String(k || '').split('-').map(Number);
  if (p.length !== 3 || p.some(function(n){ return isNaN(n); })) return new Date();
  return new Date(p[0], p[1]-1, p[2]);
}
function addDays(k, n){ var d = parseKey(k); d.setDate(d.getDate() + n); return toKey(d); }
function todayKey(){ return toKey(new Date()); }
var DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function dayName(k){ return DAY_NAMES[parseKey(k).getDay()]; }
function isSunday(k){ return parseKey(k).getDay() === 0; }
function eachDate(a, b){
  var out = [], c = a, guard = 0;
  while (c <= b && guard < 4000){ out.push(c); c = addDays(c, 1); guard++; }
  return out;
}
function diffDays(a, b){ return Math.round((parseKey(b) - parseKey(a)) / 86400000); }
function prettyDate(k){
  var d = parseKey(k);
  return d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short', year:'numeric' });
}
function shortDate(k){
  var d = parseKey(k);
  return d.toLocaleDateString(undefined, { day:'numeric', month:'short' });
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function pct(a, b){ return b > 0 ? Math.round((a / b) * 100) : 0; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function escapeHtml(value){
  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function slug(s){

}
function subjectColor(s){ return SUBJECT_COLORS[s] || '#8fa2c7'; }
function num(v, d){ var n = Number(v); return isFinite(n) ? n : (d || 0); }

function minToTime(m){
  m = ((m % 1440) + 1440) % 1440;
  var h = Math.floor(m / 60), mm = m % 60;
  var ampm = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12; if (h12 === 0) h12 = 12;
  return pad2(h12) + ':' + pad2(mm) + ' ' + ampm;
}
function minToShortTime(m){
  m = ((m % 1440) + 1440) % 1440;

  var ampm = h >= 12 ? 'PM' : 'AM';

    sleep: {},

    tests: [],
    errors: [],

    calendarNotes: {},

function createChapterEntries(){
  var o = {};
  CHAPTER_MASTER.forEach(function(c){
    o[c.id] = {
      id: c.id, subject: c.subject, name: c.name, area: c.area,
      priority: c.priority, phase: c.phase,
      steps: { learn:false, practice:false, r1:false, r2:false, r3:false, pyq:false, test:false },
      statusOverride:'', weak:false, mastered:false,
      startDate:'', endDate:'', r1Date:'', r2Date:'', r3Date:'',
      pyqDate:'', testDate:'', notes:'',
      questionsSolved:0, pyqsDone:0, testsDone:0
    };
  });
  return o;
}

function mergeStateWithDefaults(parsed){
  var def = createDefaultState();
  var out = Object.assign({}, def, parsed || {});
  var p = parsed || {};

  out.settings = Object.assign({}, def.settings, p.settings || {});
  out.settings.weights = Object.assign({}, def.settings.weights, (p.settings && p.settings.weights) || {});

  ['tasks','customTasks','habits','habitNotes','notes','fitness','nutrition','water','sleep','revisionDone','calendarNotes']
    .forEach(function(k){
      if (!out[k] || typeof out[k] !== 'object' || Array.isArray(out[k])) out[k] = {};
    });

  ['pyqs','tests','errors','focusSessions','recoveryLog','recent'].forEach(function(k){
    if (!Array.isArray(out[k])) out[k] = [];
  });

  var userCh = (p.chapters && typeof p.chapters === 'object') ? p.chapters : {};
  var merged = {};
  CHAPTER_MASTER.forEach(function(mc){
    var u = userCh[mc.id] || {};
    merged[mc.id] = Object.assign({}, def.chapters[mc.id], u);
    merged[mc.id].steps = Object.assign({}, def.chapters[mc.id].steps, u.steps || {});
    merged[mc.id].subject = mc.subject;
    merged[mc.id].name = mc.name;
    merged[mc.id].area = mc.area;
    merged[mc.id].phase = mc.phase;
  });
  Object.keys(userCh).forEach(function(k){
    if (!merged[k]) merged[k] = Object.assign({}, userCh[k]);
  });
  out.chapters = merged;
  out.version = DATA_VERSION;
  return out;
}

function loadData(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw){ state = createDefaultState(); return; }
    var parsed = JSON.parse(raw);
    state = mergeStateWithDefaults(parsed);
  } catch (error){
    console.error('Storage recovery:', error);
    try {
      localStorage.setItem(STORAGE_KEY + '_corrupt_' + Date.now(), localStorage.getItem(STORAGE_KEY) || '');
    } catch(e){}
    state = createDefaultState();
    setTimeout(function(){ toast('Storage was unreadable — a fresh state was created.'); }, 600);
  }
}

var saveHandle = null;
function saveData(immediate){
  if (!state) return;
  if (immediate){ clearTimeout(saveHandle); writeNow(); return; }
  setSaveStatus('Saving…', 'warn');
  clearTimeout(saveHandle);
  saveHandle = setTimeout(writeNow, 220);
}
function writeNow(){
  try {
    state.version = DATA_VERSION;
    state.lastSaved = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    setSaveStatus('✓ Saved', 'ok');
    clearTimeout(writeNow._t);
    writeNow._t = setTimeout(function(){ setSaveStatus('Ready', ''); }, 1600);
  } catch (e){
    console.error('Save failed:', e);
    setSaveStatus('Storage blocked', 'err');
    toast('Could not save data (storage full or blocked).');
  }
}

function validateState(){
  if (!state || typeof state !== 'object') state = createDefaultState();
  if (!state.settings) state.settings = createDefaultState().settings;
  if (!state.settings.weights) state.settings.weights = defaultWeights();
  if (!state.chapters) state.chapters = createChapterEntries();
  ['tasks','customTasks','habits','notes','fitness','nutrition','water','sleep','habitNotes','revisionDone','calendarNotes']
    .forEach(function(k){ if (!state[k] || typeof state[k] !== 'object' || Array.isArray(state[k])) state[k] = {}; });
  ['pyqs','tests','errors','focusSessions','recoveryLog','recent']
    .forEach(function(k){ if (!Array.isArray(state[k])) state[k] = []; });
}

/* ---------------------------------------------------------------------------
   4. SCHEDULE ENGINE
   --------------------------------------------------------------------------- */
function chaptersOf(subject, phase){
  return CHAPTER_MASTER.filter(function(c){
    return c.subject === subject && (!phase || c.phase === phase);
  });
}
function allOf(subject){ return chaptersOf(subject, null); }

function pickFrom(list, i, total){
  if (!list || !list.length) return null;
  var per = Math.max(1, Math.ceil(total / list.length));
  var idx = Math.min(list.length - 1, Math.floor(i / per));
  return list[idx];
}

function phaseOfDate(k){
  for (var i = 0; i < PHASES.length; i++){
    if (k >= PHASES[i].start && k <= PHASES[i].end) return PHASES[i];
  }
  return null;
}

function buildStudyDay(k, phaseKey, i, total, lists){
  var isSat = parseKey(k).getDay() === 6;
  var tasks = [];
  function push(label, type, subject, minutes){
    tasks.push({
      id: k + '::' + type + '::' + slug(label),
      label: label, type: type, subject: subject || null,
      minutes: minutes || 30, done: false
    });
  }

  var mathCh = pickFrom(lists.math, i, total);
  var secSubject = (i % 2 === 0) ? 'Physics' : 'Chemistry';
  var secList = (secSubject === 'Physics') ? lists.phy : lists.chem;
  var secCh = pickFrom(secList, i, total);
  var workout = (i % 3 === 2) ? WORKOUTS[2] : (i % 2 === 0 ? WORKOUTS[0] : WORKOUTS[1]);

  var mainSubject, mainChapter, secondarySubject, secondaryTopic;

  if (phaseKey === 'October' || phaseKey === 'November'){
    mainSubject = 'Mathematics';
    mainChapter = mathCh ? mathCh.name : 'Mixed Mathematics Practice';
    secondarySubject = secSubject;
    secondaryTopic = secCh ? secCh.name : 'Concept + Numericals';

    push('Mathematics Block A — ' + mainChapter + ' · Learn + Notes','study','Mathematics',50);
    push('Mathematics Block B — ' + mainChapter + ' · Practice Set','practice','Mathematics',50);
    push(secondarySubject + ' — ' + secondaryTopic + ' · Concept + Numericals','study',secondarySubject,50);
    push('Formula / Reaction / Recall Drill','formula',secondarySubject,10);
    push('Revision Block — Active Recall','revision',null,30);
    push('PYQ Practice — ' + mainChapter,'pyq','Mathematics',30);
    if (isSat) push('Weekly Mixed Test (timed)','test','Mixed',60);
    push(workout.name,'workout','Workout',60);

  } else if (phaseKey === 'December'){
    var mCh = pickFrom(lists.math, i, total);
    var pCh = pickFrom(lists.phy, i, total);
    var cCh = pickFrom(lists.chem, i, total);
    var langSubject = (i % 2 === 0) ? 'Hindi' : 'English';
    mainSubject = 'Revision';
    mainChapter = (mCh ? mCh.name : 'Mathematics') + ' · R2/R3';
    secondarySubject = 'Physics / Chemistry';
    secondaryTopic = (pCh ? pCh.name : 'Physics') + ' • ' + (cCh ? cCh.name : 'Chemistry');

    push('Mathematics Revision — ' + (mCh ? mCh.name : 'Mixed') + ' · R2/R3','revision','Mathematics',50);
    push('Physics Revision — ' + (pCh ? pCh.name : 'Mixed') + ' · Derivations + Numericals','revision','Physics',40);
    push('Chemistry Revision — ' + (cCh ? cCh.name : 'Mixed') + ' · Reactions + NCERT','revision','Chemistry',40);
    push(langSubject + ' — Active Preparation (Literature / Grammar / Writing)','study',langSubject,45);
    push('PYQ — Timed Set','pyq','Mixed',40);
    push('Error Log Review','revision',null,20);
    if (isSat) push('Half-Syllabus Test (timed)','test','Mixed',90);
    push(workout.name,'workout','Workout',60);

  } else {
    var jCh = pickFrom(lists.math, i, total);
    var jpCh = pickFrom(lists.phy, i, total);
    var jcCh = pickFrom(lists.chem, i, total);
    var rotate = i % 3;
    var focusSub = rotate === 0 ? 'Mathematics' : (rotate === 1 ? 'Physics' : 'Chemistry');
    var focusCh = rotate === 0 ? jCh : (rotate === 1 ? jpCh : jcCh);
    mainSubject = 'Full Revision';
    mainChapter = focusSub + ' — ' + (focusCh ? focusCh.name : 'Full Syllabus');
    secondarySubject = 'Mixed';
    secondaryTopic = 'Weak chapters + Error correction';

    push(focusSub + ' Revision — ' + (focusCh ? focusCh.name : 'Full Syllabus'),'revision',focusSub,60);
    push('Timed PYQ Paper','pyq','Mixed',60);
    push('Error Correction Session','revision',null,30);
    push('Formula / Reaction Rapid Review','formula','Mixed',25);
    push('Language Writing Practice','practice','English',30);
    if (i % 3 === 1) push('Board-Style Mock Test (timed)','test','Mixed',120);
    push(workout.name,'workout','Workout',60);
  }

  var ph = PHASES.filter(function(p){ return p.key === phaseKey; })[0] || {};
  return {
    date: k, dayName: dayName(k), isRest: false,
    phaseKey: phaseKey,
    phaseLabel: ph.label || phaseKey,
    phaseDesc: ph.desc || '',
    mainSubject: mainSubject,
    mainChapter: mainChapter,
    secondarySubject: secondarySubject,
    secondaryTopic: secondaryTopic,
    tasks: tasks,
    sleepTarget: '11:00 PM → 6:00 AM',
    waterTarget: num(state && state.settings ? state.settings.waterTarget : 8, 8),
    nutritionReminder: 'Balanced meals + hydration. Food first. No forced eating.'

}

function buildGenericDay(k){
  var before = k < PLANNING_START;
  return {
    date: k, dayName: dayName(k), isRest: isSunday(k),
    phaseKey: before ? 'Pre-Planning' : 'Post-Planning',
    phaseLabel: before ? 'Before Planning Window' : 'After Planning Window',
    phaseDesc: before ? 'Planning window opens 1 October 2026' : 'Planning window completed on 1 February 2027',
    mainSubject: '—',
    mainChapter: before ? 'Prepare materials and settle the routine.' : 'Review, consolidate, and rest.',
    secondarySubject:'', secondaryTopic:'',
    tasks: [],
    sleepTarget: '11:00 PM → 6:00 AM',
    waterTarget: num(state && state.settings ? state.settings.waterTarget : 8, 8),
    nutritionReminder: 'Balanced meals + hydration.'
  };
}

function buildSchedule(){
  var sched = {};
  var dates = eachDate(PLANNING_START, PLANNING_END);

  PHASES.forEach(function(ph){
    var phaseDates = dates.filter(function(d){ return d >= ph.start && d <= ph.end; });
    if (!phaseDates.length) return;

    var studyDays = phaseDates.filter(function(d){ return !isSunday(d); });
    phaseDates.filter(isSunday).forEach(function(d){ sched[d] = buildRestDay(d); });

    if (!studyDays.length) return;

    var lists;
    if (ph.key === 'October' || ph.key === 'November'){
      lists = {
        math: chaptersOf('Mathematics', ph.key),
        phy:  chaptersOf('Physics', ph.key),
        chem: chaptersOf('Chemistry', ph.key)
      };
    } else {
      lists = { math: allOf('Mathematics'), phy: allOf('Physics'), chem: allOf('Chemistry') };
    }

    var total = studyDays.length;
    studyDays.forEach(function(d, i){
      if (ph.key === 'Final') sched[d] = buildFinalDay(d);
      else sched[d] = buildStudyDay(d, ph.key, i, total, lists);
    });
  });

  sched[PLANNING_END] = buildFinalDay(PLANNING_END);
  return sched;
}

function getDayPlan(k){
  if (schedule[k]) return schedule[k];
  return buildGenericDay(k);
}
function getSelectedDay(){ return getDayPlan(calendarSelected); }

/* ---------------------------------------------------------------------------
   5. COMPUTATIONS
   --------------------------------------------------------------------------- */
function chapterCompletion(ch){
  if (!ch || !ch.steps) return 0;
  var done = CHAPTER_STEPS.filter(function(s){ return ch.steps[s.key]; }).length;
  return pct(done, CHAPTER_STEPS.length);
}
function chapterStatus(ch){
  if (!ch) return 'Not Started';
  if (ch.statusOverride) return ch.statusOverride;
  if (ch.weak) return 'Weak';
  var c = chapterCompletion(ch);
  if (c <= 0) return 'Not Started';
  if (c >= 100) return ch.mastered ? 'Mastered' : 'Completed';
  return 'In Progress';
}
function statusBadgeClass(st){
  switch (st){
    case 'Completed': return 'b-green';
    case 'Mastered': return 'b-green';
    case 'In Progress': return 'b-blue';
    case 'Needs Revision': return 'b-amber';
    case 'Weak': return 'b-red';
    default: return 'b-muted';
  }
}

function recalcRevisionDates(ch){
  if (!ch) return;
  var completed = chapterCompletion(ch) >= 100;
  var base = ch.endDate || todayKey();
  if (completed){
    if (!ch.r1Date) ch.r1Date = addDays(base, 4);
    if (!ch.r2Date) ch.r2Date = addDays(base, 14);
    if (!ch.r3Date) ch.r3Date = addDays(base, 35);
  } else {
    ch.r1Date = ''; ch.r2Date = ''; ch.r3Date = '';
  }
}

function updateChapter(id, patch){
  var ch = state.chapters[id];
  if (!ch) return;
  Object.assign(ch, patch || {});
  if (!ch.startDate) ch.startDate = todayKey();
  var comp = chapterCompletion(ch);
  if (comp >= 100 && !ch.endDate) ch.endDate = todayKey();
  if (comp < 100) ch.endDate = '';
  recalcRevisionDates(ch);
  saveData();
  refreshAll();
}

function toggleChapterStep(id, stepKey){
  var ch = state.chapters[id];
  if (!ch) return;
  if (!ch.steps) ch.steps = {};
  ch.steps[stepKey] = !ch.steps[stepKey];
  if (!ch.startDate) ch.startDate = todayKey();
  if (chapterCompletion(ch) >= 100 && !ch.endDate) ch.endDate = todayKey();
  if (chapterCompletion(ch) < 100) ch.endDate = '';
  if (stepKey === 'pyq' && ch.steps.pyq && !ch.pyqDate) ch.pyqDate = todayKey();
  if (stepKey === 'test' && ch.steps.test && !ch.testDate) ch.testDate = todayKey();
  recalcRevisionDates(ch);
  saveData();
  refreshAll();
}

function getRevisionsFor(dateKey){
  var out = [];
  Object.keys(state.chapters || {}).forEach(function(id){
    var ch = state.chapters[id];
    if (!ch) return;
    ['r1','r2','r3'].forEach(function(rk){
      var d = ch[rk + 'Date'];
      if (d && d === dateKey && !(ch.steps && ch.steps[rk])) out.push({ chapter: ch, round: rk });
    });
  });
  return out;
}

function getRevisionBuckets(){
  var today = todayKey();
  var due = [], overdue = [], upcoming = [], completed = [];
  Object.keys(state.chapters || {}).forEach(function(id){
    var ch = state.chapters[id];
    if (!ch) return;
    ['r1','r2','r3'].forEach(function(rk){
      var d = ch[rk + 'Date'];
      if (!d) return;
      var done = !!(ch.steps && ch.steps[rk]);
      if (done){ completed.push({ chapter: ch, round: rk, date: d }); return; }
      if (d === today) due.push({ chapter: ch, round: rk, date: d });
      else if (d < today) overdue.push({ chapter: ch, round: rk, date: d });
      else upcoming.push({ chapter: ch, round: rk, date: d });
    });
  });
  overdue.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  upcoming.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  return { due: due, overdue: overdue, upcoming: upcoming, completed: completed };
}

function tasksFor(k){
  var p = getDayPlan(k);
  var base = Array.isArray(p.tasks) ? p.tasks.slice() : [];
  var custom = (state.customTasks && state.customTasks[k]) ? state.customTasks[k] : [];
  return base.concat(custom);
}

function taskStats(k){
  var tasks = tasksFor(k);
  var done = state.tasks[k] || {};
  var total = tasks.length;
  var completed = tasks.filter(function(t){ return done[t.id]; }).length;
  return { total: total, completed: completed, pct: pct(completed, total) };
}

function typeStats(k, types){
  var tasks = tasksFor(k).filter(function(t){ return types.indexOf(t.type) !== -1; });
  var done = state.tasks[k] || {};
  var completed = tasks.filter(function(t){ return done[t.id]; }).length;
  return { total: tasks.length, completed: completed, pct: pct(completed, tasks.length) };
}

function subjectTaskStats(k, subject){
  var tasks = tasksFor(k).filter(function(t){ return t.subject === subject; });
  var done = state.tasks[k] || {};
  var completed = tasks.filter(function(t){ return done[t.id]; }).length;
  return { total: tasks.length, completed: completed, pct: pct(completed, tasks.length) };
}

function habitStats(k){
  var h = state.habits[k] || {};
  var completed = HABIT_NAMES.filter(function(n){ return h[n]; }).length;
  return { total: HABIT_NAMES.length, completed: completed, pct: pct(completed, HABIT_NAMES.length) };
}

function workoutStats(k){
  var f = state.fitness[k];
  if (!f || !Array.isArray(f.exercises) || !f.exercises.length) return { total:0, completed:0, pct:0 };
  var completed = f.exercises.filter(function(e){ return e.done; }).length;
  return { total: f.exercises.length, completed: completed, pct: pct(completed, f.exercises.length) };
}

function focusMinutesFor(k){
  return (state.focusSessions || []).filter(function(s){ return s.date === k; })
    .reduce(function(a, s){ return a + num(s.minutes, 0); }, 0);
}

function calculateDailyScore(k){
  var w = state.settings.weights || defaultWeights();
  var plan = getDayPlan(k);
  if (plan.isRest){
    var hs = habitStats(k);
    return Math.round((hs.pct / 100) * 100);
  }
  var study = typeStats(k, ['study','practice','formula']);
  var revision = typeStats(k, ['revision']);
  var pyq = typeStats(k, ['pyq']);
  var math = subjectTaskStats(k, 'Mathematics');
  var phy = subjectTaskStats(k, 'Physics');
  var chem = subjectTaskStats(k, 'Chemistry');
  var phychem = { pct: Math.round((phy.pct + chem.pct) / 2) };
  var habits = habitStats(k);
  var wo = workoutStats(k);

  var score =
    (study.pct / 100) * num(w.study, 40) +
    (revision.pct / 100) * num(w.revision, 15) +
    (pyq.pct / 100) * num(w.pyq, 10) +
    (math.pct / 100) * num(w.math, 10) +
    (phychem.pct / 100) * num(w.phychem, 10) +
    (habits.pct / 100) * num(w.habits, 10) +
    (wo.pct / 100) * num(w.workout, 5);

  return clamp(Math.round(score), 0, 100);
}

function calculateStudyStreak(){
  var streak = 0;
  var cursor = todayKey();
  for (var i = 0; i < 400; i++){
    var plan = getDayPlan(cursor);
    if (plan.isRest){ cursor = addDays(cursor, -1); continue; }
    var st = typeStats(cursor, ['study','practice','formula','revision']);
    if (st.completed > 0){ streak++; cursor = addDays(cursor, -1); }
    else break;
  }
  return streak;
}

function calculateHabitStreak(){
  var streak = 0;
  var cursor = todayKey();
  for (var i = 0; i < 400; i++){
    var hs = habitStats(cursor);
    if (hs.completed >= Math.ceil(HABIT_NAMES.length * 0.5)){ streak++; cursor = addDays(cursor, -1); }
    else break;
  }
  return streak;
}

function calculateBestHabitStreak(){
  var keys = Object.keys(state.habits || {}).sort();
  if (!keys.length) return 0;
  var best = 0, cur = 0, prev = null;
  keys.forEach(function(k){
    var hs = habitStats(k);
    var ok = hs.completed >= Math.ceil(HABIT_NAMES.length * 0.5);
    if (ok){
      if (prev && diffDays(prev, k) === 1) cur++; else cur = 1;
      best = Math.max(best, cur);
      prev = k;
    } else { cur = 0; prev = null; }
  });
  return best;
}

function calculateDaysRemaining(){ return diffDays(todayKey(), PLANNING_END); }

function currentPhase(){
  var t = todayKey();
  for (var i = 0; i < PHASES.length; i++){
    if (t >= PHASES[i].start && t <= PHASES[i].end) return PHASES[i];
  }
  return t < PLANNING_START
    ? { key:'Pre', label:'Before Planning Window', desc:'Opens 1 October 2026' }
    : { key:'Post', label:'Planning Window Complete', desc:'Completed 1 February 2027' };
}

function subjectProgress(subject){
  var list = Object.keys(state.chapters).map(function(k){ return state.chapters[k]; })
    .filter(function(c){ return c.subject === subject; });
  if (!list.length) return { total:0, completed:0, avg:0, weak:0, remaining:0, list:[] };
  var sum = 0, completed = 0, weak = 0;
  list.forEach(function(c){
    var cp = chapterCompletion(c);
    sum += cp;
    if (cp >= 100) completed++;
    if (c.weak) weak++;
  });
  return {
    total: list.length, completed: completed, remaining: list.length - completed,
    avg: Math.round(sum / list.length), weak: weak, list: list
  };
}

function academicCompletion(){
  var all = Object.keys(state.chapters).map(function(k){ return state.chapters[k]; });
  if (!all.length) return 0;
  var sum = all.reduce(function(a, c){ return a + chapterCompletion(c); }, 0);
  return Math.round(sum / all.length);
}

function weeklyAverageScore(offsetWeeks){
  var end = addDays(todayKey(), -7 * (offsetWeeks || 0));
  var start = addDays(end, -6);
  var days = eachDate(start, end);
  var vals = days.map(function(d){ return calculateDailyScore(d); });
  if (!vals.length) return 0;
  return Math.round(vals.reduce(function(a,b){ return a+b; }, 0) / vals.length);
}

function monthlyStats(monthKey){
  var ph = PHASES.filter(function(p){ return p.key === monthKey; })[0];
  if (!ph) return null;
  var days = eachDate(ph.start, ph.end);
  var planned = 0, completed = 0, scores = [], habitSum = 0, habitDays = 0;
  var subjSum = {}, subjCount = {};
  SUBJECTS.forEach(function(s){ subjSum[s]=0; subjCount[s]=0; });
  var revP = 0, revN = 0, pyqP = 0, pyqN = 0, mockCount = 0, woSum = 0, woN = 0, sleepSum = 0, sleepN = 0;

  days.forEach(function(d){
    var ts = taskStats(d);
    planned += ts.total;
    completed += ts.completed;
    scores.push(calculateDailyScore(d));

    var hs = habitStats(d);
    if (hs.total){ habitSum += hs.pct; habitDays++; }

    SUBJECTS.forEach(function(s){
      var ss = subjectTaskStats(d, s);
      if (ss.total){ subjSum[s] += ss.pct; subjCount[s]++; }
    });

    var rv = typeStats(d, ['revision']);
    if (rv.total){ revP += rv.pct; revN++; }
    var pq = typeStats(d, ['pyq']);
    if (pq.total){ pyqP += pq.pct; pyqN++; }
    var wo = workoutStats(d);
    if (wo.total){ woSum += wo.pct; woN++; }

    if (state.sleep[d] && num(state.sleep[d].hours, 0) > 0){
      sleepSum += num(state.sleep[d].hours, 0); sleepN++;
    }
  });

  mockCount = (state.tests || []).filter(function(t){ return t.date >= ph.start && t.date <= ph.end; }).length;

  var subjAvg = {};
  SUBJECTS.forEach(function(s){ subjAvg[s] = subjCount[s] ? Math.round(subjSum[s] / subjCount[s]) : 0; });

  return {
    key: monthKey, label: ph.label,
    planned: planned, completed: completed,
    completion: pct(completed, planned),
    subjects: subjAvg,
    revision: revN ? Math.round(revP / revN) : 0,
    pyq: pyqN ? Math.round(pyqP / pyqN) : 0,
    mocks: mockCount,
    avgScore: scores.length ? Math.round(scores.reduce(function(a,b){return a+b;},0) / scores.length) : 0,
    habit: habitDays ? Math.round(habitSum / habitDays) : 0,
    workout: woN ? Math.round(woSum / woN) : 0,
    sleep: sleepN ? Math.round((sleepSum / sleepN) * 10) / 10 : 0
  };
}

/* ---------------------------------------------------------------------------
   6. REAL-TIME ENGINE
   --------------------------------------------------------------------------- */
function currentMinutes(){
  var d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}

function getCurrentSlot(){
  var m = currentMinutes();
  /* Sleep slot wraps: 23:00 → 06:00 */
  if (m < 360) return ROUTINE_SLOTS[ROUTINE_SLOTS.length - 1];
  for (var i = 0; i < ROUTINE_SLOTS.length; i++){
    var s = ROUTINE_SLOTS[i];
    if (s.s <= m && m < s.e) return s;
  }
  return ROUTINE_SLOTS[ROUTINE_SLOTS.length - 2];
}

function getNextSlot(){
  var m = currentMinutes();
  var list = ROUTINE_SLOTS;
  for (var i = 0; i < list.length; i++){
    if (list[i].s > m) return list[i];
  }
  return list[0]; /* next day's wake */
}

function slotProgress(slot){
  if (!slot) return 0;
  var m = currentMinutes();
  var start = slot.s;
  var end = slot.e;
  if (end > 1440){
    /* Sleep wrap */
    if (m < 360) m += 1440;
  }
  var dur = end - start;
  if (dur <= 0) return 0;
  return clamp(Math.round(((m - start) / dur) * 100), 0, 100);
}

function slotElapsed(slot){
  if (!slot) return 0;
  var m = currentMinutes();
  if (slot.e > 1440 && m < 360) m += 1440;
  return Math.max(0, m - slot.s);
}
function slotRemaining(slot){
  if (!slot) return 0;
  return Math.max(0, slot.e - slot.s - slotElapsed(slot));
}

function dayProgress(){
  var d = new Date();
  var m = d.getHours() * 60 + d.getMinutes();
  return clamp(Math.round((m / 1440) * 100), 0, 100);
}

function getCurrentTask(k){
  /* Maps the current routine slot to a task in the day plan if possible */
  var slot = getCurrentSlot();
  if (!slot || slot.kind === 'sleep') return null;
  var tasks = tasksFor(k);
  if (!tasks.length) return null;
  var done = state.tasks[k] || {};
  /* Try to match by subject & type */
  var subject = slot.subject;
  var typeGuess = slot.kind === 'study' ? 'study' : (slot.kind === 'workout' ? 'workout' : null);
  var candidates = tasks.filter(function(t){
    if (done[t.id]) return false;
    if (subject && t.subject && t.subject !== subject) return false;
    if (typeGuess && t.type !== typeGuess) return false;
    return true;
  });
  return candidates[0] || tasks.filter(function(t){ return !done[t.id]; })[0] || null;
}

/* Recovery mode detection */
function computeRecoveryInfo(){
  var cursor = todayKey();
  var missed = 0;
  for (var i = 1; i <= 30; i++){
    var d = addDays(cursor, -i);
    var plan = getDayPlan(d);
    if (plan.isRest) continue;
    var st = taskStats(d);
    if (st.total === 0) continue;
    if (st.completed === 0) missed++;
    else break;
  }
  var buckets = getRevisionBuckets();
  return {
    missedDays: missed,
    overdueCount: buckets.overdue.length,
    active: missed >= 3 || buckets.overdue.length >= 5
  };
}

   --------------------------------------------------------------------------- */
function kpi(label, value, sub, cls){
  return '<div class="kpi' + (cls ? ' ' + cls : '') + '">' +
    '<div class="k-label">' + escapeHtml(label) + '</div>' +
    '<div class="k-value">' + escapeHtml(String(value)) + '</div>' +
    '<div class="k-sub">' + escapeHtml(String(sub || '')) + '</div>' +
  '</div>';
}
function pbarRow(label, value, colorClass){
  var v = clamp(Math.round(num(value, 0)), 0, 100);
  return '<div class="pbar-row">' +
    '<span class="pl">' + escapeHtml(label) + '</span>' +
    '<span class="pbar ' + (colorClass || '') + '"><i style="width:' + v + '%"></i></span>' +
    '<span class="pv">' + v + '%</span>' +
  '</div>';
}
function chip(text, color){
  var c = color ? ' style="border-color:' + color + '55;color:' + color + '"' : '';
  return '<span class="chip"' + c + '>' + escapeHtml(text) + '</span>';
}
function dot(color){ return '<span class="dot" style="background:' + color + '"></span>'; }
function badge(text, cls){ return '<span class="badge ' + (cls || 'b-muted') + '">' + escapeHtml(text) + '</span>'; }

function barChart(items){
  if (!items || !items.length) return '<div class="empty">No data yet.</div>';
  var max = Math.max(1, Math.max.apply(null, items.map(function(i){ return num(i.value, 0); })));
  return '<div>' + items.map(function(i){
    var v = clamp(Math.round(num(i.value, 0)), 0, 100);
    var w = Math.round((num(i.value,0) / max) * 100);
    return '<div class="pbar-row">' +
      '<span class="pl">' + escapeHtml(i.label) + '</span>' +
      '<span class="pbar"><i style="width:' + w + '%;background:' + (i.color || '#3b82f6') + '"></i></span>' +
      '<span class="pv">' + escapeHtml(String(i.display !== undefined ? i.display : v + '%')) + '</span>' +
    '</div>';
  }).join('') + '</div>';
}

function lineChart(points){
  if (!points || points.length < 2) return '<div class="empty">Not enough data for a trend yet.</div>';
  var w = 560, h = 160, padL = 34, padB = 24, padT = 12, padR = 10;
  var vals = points.map(function(p){ return num(p.value, 0); });
  var max = Math.max.apply(null, vals.concat([1]));
  var min = Math.min.apply(null, vals.concat([0]));
  var range = Math.max(1, max - min);
  var stepX = (w - padL - padR) / Math.max(1, points.length - 1);
  var coords = points.map(function(p, i){
    var x = padL + i * stepX;
    var y = padT + (h - padT - padB) * (1 - (num(p.value,0) - min) / range);
    return { x: x, y: y, p: p };
  });
  var path = coords.map(function(c, i){ return (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ' ' + c.y.toFixed(1); }).join(' ');
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="160" role="img" aria-label="Trend chart">';
  svg += '<line x1="' + padL + '" y1="' + (h - padB) + '" x2="' + (w - padR) + '" y2="' + (h - padB) + '" stroke="rgba(120,160,255,.25)" stroke-width="1"/>';
  svg += '<path d="' + path + '" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  coords.forEach(function(c, i){
    svg += '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="3.5" fill="#60a5fa"/>';
    if (i === 0 || i === coords.length - 1 || i % Math.ceil(coords.length / 6) === 0){
      svg += '<text x="' + c.x.toFixed(1) + '" y="' + (h - 7) + '" font-size="9" fill="#8fa2c7" text-anchor="middle">' + escapeHtml(String(c.p.label || '')) + '</text>';
    }
  });
  svg += '<text x="4" y="' + (padT + 8) + '" font-size="9" fill="#8fa2c7">' + max + '</text>';
  svg += '<text x="4" y="' + (h - padB) + '" font-size="9" fill="#8fa2c7">' + min + '</text>';
  svg += '</svg>';
  return svg;
}

function heatmap(days, getLevel){
  if (!days || !days.length) return '<div class="empty">No data.</div>';
  return '<div class="heat">' + days.map(function(d){
    var lv = clamp(num(getLevel(d), 0), 0, 4);
    return '<div class="heat-cell l' + lv + '" title="' + escapeHtml(shortDate(d) + ' — level ' + lv) + '" data-act="goto-day" data-date="' + escapeHtml(d) + '"></div>';
  }).join('') + '</div>';
}
function habitLevel(k){
  var hs = habitStats(k);
  if (hs.completed === 0) return 0;
  return clamp(Math.ceil((hs.pct / 100) * 4), 1, 4);
}

function renderTimeline(){
  var k = todayKey();
  var now = currentMinutes();
  var html = '<div class="section-head"><h2>Daily Timeline</h2><span class="sub">' + escapeHtml(prettyDate(k)) + ' • live status</span></div>';

  html += '<div class="card">';
  html += ROUTINE_SLOTS.map(function(s){
    var cls = 'upcoming';
    var start = s.s, end = s.e;
    var n = now;
    if (end > 1440 && n < 360) n += 1440;
    if (n >= start && n < end) cls = 'current';
    else if (n >= end) cls = 'past';
    var progress = 0;
    if (cls === 'current'){
      progress = clamp(Math.round(((n - start) / (end - start)) * 100), 0, 100);
    } else if (cls === 'past') progress = 100;
    var displayEnd = end === 1800 ? 360 : end;
    return '<div class="tl-item ' + cls + '">' +
      '<span class="tl-time">' + escapeHtml(minToTime(s.s)) + ' – ' + escapeHtml(minToTime(displayEnd)) + '</span>' +
      '<span style="flex:1;min-width:0"><b>' + escapeHtml(s.label) + '</b>' +
      (cls === 'current' ? '<div style="margin-top:6px">' + pbarRow('', progress, 'green') + '</div>' : '') +
      '</span>' +
      (cls === 'current' ? badge('NOW', 'b-green') : (cls === 'past' ? badge('Done', 'b-muted') : badge('Upcoming', 'b-blue'))) +
    '</div>';
  }).join('');
  html += '</div>';

  return html;
}

function renderCalendar(){
  var cursor = parseKey(calendarCursor);
  var y = cursor.getFullYear(), m = cursor.getMonth();
  var first = new Date(y, m, 1);
  var startDow = first.getDay();
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var today = todayKey();

  var cells = [];
  for (var i = 0; i < startDow; i++){
    var pd = new Date(y, m, 1 - (startDow - i));
    cells.push({ date: toKey(pd), out: true });
  }
  for (var d = 1; d <= daysInMonth; d++){
    cells.push({ date: toKey(new Date(y, m, d)), out: false });
  }
  while (cells.length % 7 !== 0){
    var last = parseKey(cells[cells.length - 1].date);
    last.setDate(last.getDate() + 1);
    cells.push({ date: toKey(last), out: true });
  }

  var monthLabel = first.toLocaleDateString(undefined, { month:'long', year:'numeric' });

  var html = '';
  html += '<div class="section-head"><h2>Calendar</h2><span class="sub">Click any date for the day control panel</span></div>';

  html += '<div class="card">';
  html += '<div class="cal-head">' +
    '<button class="btn sm ghost" data-act="cal-prev" type="button">‹ Prev</button>' +
    '<div class="cal-title">' + escapeHtml(monthLabel) + '</div>' +
    '<button class="btn sm ghost" data-act="cal-next" type="button">Next ›</button>' +
    '<button class="btn sm" data-act="cal-today" type="button">Today</button>' +
    '<span class="spacer"></span>' +
    '<button class="btn sm ghost" data-act="cal-jump" data-date="' + escapeHtml(PLANNING_START) + '" type="button">Plan Start</button>' +
    '<button class="btn sm ghost" data-act="cal-jump" data-date="' + escapeHtml(PLANNING_END) + '" type="button">Plan End</button>' +
  '</div>';
  html += '<div class="cal-grid">' +
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){ return '<div class="cal-dow">' + d + '</div>'; }).join('') +
    cells.map(function(c){
      var sum = daySummary(c.date);
      var cls = 'cal-cell' + (c.out ? ' out' : '') + (c.date === today ? ' today' : '') + (c.date === calendarSelected ? ' sel' : '') + (sum.rest ? ' rest' : '');
      var badges = '';
      if (sum.rest) badges += '<span class="cal-badge b-green">REST</span>';
      if (sum.rev) badges += '<span class="cal-badge b-amber">R' + sum.rev + '</span>';
      if (sum.pyq) badges += '<span class="cal-badge b-blue">P' + sum.pyq + '</span>';
      if (sum.tests) badges += '<span class="cal-badge b-red">T' + sum.tests + '</span>';
      if (sum.notes) badges += '<span class="cal-badge b-muted">✐</span>';
      return '<div class="' + cls + '" data-act="cal-select" data-date="' + escapeHtml(c.date) + '" role="button" tabindex="0">' +
        '<div class="cal-dnum">' + parseKey(c.date).getDate() + '</div>' +
        '<div class="cal-badges">' + badges + '</div>' +
        (sum.total ? '<div class="cal-bar"><i style="width:' + sum.pct + '%"></i></div>' : '') +
      '</div>';
    }).join('') +
  '</div>';
  html += '</div>';

  html += '<div class="card mt16"><div class="card-title">' + escapeHtml(prettyDate(calendarSelected)) + '</div>';
  html += renderDayDetail(calendarSelected);
  html += '</div>';

  return html;
}

function daySummary(k){
  var plan = getDayPlan(k);
  var done = state.tasks[k] || {};
  var tasks = tasksFor(k);
  var completed = tasks.filter(function(t){ return done[t.id]; }).length;
  var rev = getRevisionsFor(k).length;
  var pyq = (state.pyqs || []).filter(function(p){ return p.date === k; }).length;
  var tests = (state.tests || []).filter(function(t){ return t.date === k; }).length;
  var n = state.notes[k] || {};
  var hasNotes = !!(n.daily || n.doubts || n.weak || n.tomorrow);
  return {
    total: tasks.length, completed: completed, pct: pct(completed, tasks.length),
    rev: rev, pyq: pyq, tests: tests, notes: hasNotes, rest: !!plan.isRest
  };
}

function renderWeekly(){
  var today = todayKey();
  /* Week starting Sunday */
  var dow = parseKey(today).getDay();
  var weekStart = addDays(today, -dow);
  var days = eachDate(weekStart, addDays(weekStart, 6));

  var totalTasks = 0, doneTasks = 0, scoreSum = 0;
  var subjSum = {}, subjCount = {};
  SUBJECTS.forEach(function(s){ subjSum[s]=0; subjCount[s]=0; });
  var revP = 0, revN = 0, pyqP = 0, pyqN = 0;

  days.forEach(function(d){
    var ts = taskStats(d);
    totalTasks += ts.total; doneTasks += ts.completed;
    scoreSum += calculateDailyScore(d);
    SUBJECTS.forEach(function(s){
      var ss = subjectTaskStats(d, s);
      if (ss.total){ subjSum[s] += ss.pct; subjCount[s]++; }
    });
    var rv = typeStats(d, ['revision']);
    if (rv.total){ revP += rv.pct; revN++; }
    var pq = typeStats(d, ['pyq']);
    if (pq.total){ pyqP += pq.pct; pyqN++; }
  });

  var html = '<div class="section-head"><h2>Weekly Control Center</h2><span class="sub">' + escapeHtml(shortDate(weekStart)) + ' → ' + escapeHtml(shortDate(addDays(weekStart, 6))) + '</span></div>';

  html += '<div class="grid g4">' +
    kpi('Tasks', doneTasks + '/' + totalTasks, pct(doneTasks, totalTasks) + '% done', true) +
    kpi('Avg Daily Score', Math.round(scoreSum / 7) + '/100', 'This week') +
    kpi('Revision Avg', (revN ? Math.round(revP/revN) : 0) + '%', 'Revision blocks') +
    kpi('PYQ Avg', (pyqN ? Math.round(pyqP/pyqN) : 0) + '%', 'PYQ blocks') +
  '</div>';

  html += '<div class="card mt16"><div class="card-title">Subject Objectives This Week</div>' +
    SUBJECTS.map(function(s){
      var avg = subjCount[s] ? Math.round(subjSum[s]/subjCount[s]) : 0;
      return pbarRow(s, avg, '');
    }).join('') +
  '</div>';

  html += '<div class="card mt16"><div class="card-title">Day-by-Day</div>' +
    '<div class="table-wrap"><table><thead><tr><th>Day</th><th>Date</th><th>Main</th><th>Tasks</th><th>Done</th><th>Score</th></tr></thead><tbody>' +
    days.map(function(d){
      var plan = getDayPlan(d);
      var ts = taskStats(d);
      return '<tr data-act="goto-day" data-date="' + escapeHtml(d) + '" style="cursor:pointer">' +
        '<td>' + escapeHtml(dayName(d).slice(0,3)) + '</td>' +
        '<td class="num">' + escapeHtml(shortDate(d)) + '</td>' +
        '<td>' + (plan.isRest ? badge('REST','b-green') : escapeHtml(plan.mainSubject || '—')) + '</td>' +
        '<td class="num">' + ts.total + '</td>' +
        '<td class="num">' + ts.completed + '</td>' +
        '<td class="num">' + calculateDailyScore(d) + '</td>' +
      '</tr>';
    }).join('') +
    '</tbody></table></div></div>';

  return html;
}

function avgHabitPct(days){
  var list = eachDate(addDays(todayKey(), -(days - 1)), todayKey());
  if (!list.length) return 0;
  var sum = 0;
  list.forEach(function(d){ sum += habitStats(d).pct; });
  return Math.round(sum / list.length);
}

function renderFitness(){
  var k = todayKey();
  var plan = getDayPlan(k);
  var f = state.fitness[k];

  if (!f){
    var idx = diffDays(PLANNING_START, k);
    var wo = plan.isRest ? WORKOUTS[2] : (idx % 3 === 2 ? WORKOUTS[2] : (idx % 2 === 0 ? WORKOUTS[0] : WORKOUTS[1]));
    f = {
      name: plan.isRest ? 'Recovery / Mobility' : wo.name,
      exercises: wo.items.map(function(x){ return { name: x, sets:'', reps:'', rest:'', note:'', done:false }; }),
      note: ''
    };
    state.fitness[k] = f;
    saveData();

  return Math.round(sum / list.length);
}

function formatBytes(b){
  if (!b) return '0 B';
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return Math.round(b / 1024) + ' KB';
  return (Math.round((b / (1024 * 1024)) * 10) / 10) + ' MB';
}

      '<div><label class="fld">Revision</label><input type="number" min="0" max="100" data-act="weight" data-key="revision" value="' + num(w.revision, 15) + '"></div>' +
      '<div><label class="fld">PYQ</label><input type="number" min="0" max="100" data-act="weight" data-key="pyq" value="' + num(w.pyq, 10) + '"></div>' +
      '<div><label class="fld">Mathematics</label><input type="number" min="0" max="100" data-act="weight" data-key="math" value="' + num(w.math, 10) + '"></div>' +

      '<div><label class="fld">Habits</label><input type="number" min="0" max="100" data-act="weight" data-key="habits" value="' + num(w.habits, 10) + '"></div>' +

    '<label class="task"><input type="checkbox" data-act="setting-bool" data-key="notifications"' + (s.notifications ? ' checked' : '') + '><span class="t-label">Enable browser reminders (optional)</span></label>' +

    '<button class="btn ghost sm mt8" data-act="request-notify" type="button">Request Notification Permission</button>' +
  '</div>';

  html += '<div class="card mt16"><div class="card-title">Data & Info</div>' +
    '<div class="kv"><span>Storage key</span><b>' + escapeHtml(STORAGE_KEY) + '</b></div>' +
    '<div class="kv"><span>Data version</span><b>' + DATA_VERSION + '</b></div>' +

    '<div class="note"><b>Data labels used in this app:</b> OFFICIAL INFORMATION is not claimed anywhere; ' +
    'all schedules are PLANNING ASSUMPTIONS; your entries are PERSONAL TRACKING DATA; ' +

  html += '<div class="card mt16"><div class="card-title">Developer Diagnostics</div>' +

  '</div>';

  return html;
}

function weightTotal(){
